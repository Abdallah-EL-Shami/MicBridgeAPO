name: build-dll
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S MicBridgeAPO/MicBridgeAPO -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: MicBridgeAPO-dll
          path: build/Release/MicBridgeAPO.dll
