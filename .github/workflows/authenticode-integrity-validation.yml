name: authenticode-integrity-validation
on:
  push:
    branches:
      - release/practical-stability
    paths:
      - '.github/workflows/authenticode-integrity-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: authenticode-integrity-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-ui-authenticode:
    name: Validate MicBridgeUI signing with Windows PowerShell 5.1
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Sign, verify and reject a modified PowerShell UI script
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          function Write-Stage {
            param([Parameter(Mandatory = $true)][string]$Message)
            Write-Host ("[{0}] {1}" -f (Get-Date -Format 'yyyy-MM-dd HH:mm:ss.fff K'), $Message)
          }

          $total = [Diagnostics.Stopwatch]::StartNew()
          $work = Join-Path $env:RUNNER_TEMP 'MicBridgeAPO-UI-Authenticode-Test'
          $myStore = $null
          $rootStore = $null
          $rsa = $null
          $cert = $null
          $publicCert = $null
          $thumb = $null

          try {
            Write-Stage 'Preparing isolated temporary work directory.'
            New-Item -ItemType Directory -Force -Path $work | Out-Null

            Write-Stage 'Creating an ephemeral RSA key using .NET CertificateRequest (no New-SelfSignedCertificate provider call).'
            $rsa = [System.Security.Cryptography.RSACryptoServiceProvider]::new(2048)
            $subject = [System.Security.Cryptography.X509Certificates.X500DistinguishedName]::new('CN=MicBridgeAPO Ephemeral UI Authenticode Test')
            $request = [System.Security.Cryptography.X509Certificates.CertificateRequest]::new(
              $subject,
              $rsa,
              [System.Security.Cryptography.HashAlgorithmName]::SHA256,
              [System.Security.Cryptography.RSASignaturePadding]::Pkcs1
            )
            $request.CertificateExtensions.Add(
              [System.Security.Cryptography.X509Certificates.X509BasicConstraintsExtension]::new($false, $false, 0, $false)
            )
            $request.CertificateExtensions.Add(
              [System.Security.Cryptography.X509Certificates.X509KeyUsageExtension]::new(
                [System.Security.Cryptography.X509Certificates.X509KeyUsageFlags]::DigitalSignature,
                $false
              )
            )
            $ekuOids = [System.Security.Cryptography.OidCollection]::new()
            [void]$ekuOids.Add([System.Security.Cryptography.Oid]::new('1.3.6.1.5.5.7.3.3'))
            $request.CertificateExtensions.Add(
              [System.Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension]::new($ekuOids, $false)
            )

            $cert = $request.CreateSelfSigned((Get-Date).AddMinutes(-5), (Get-Date).AddDays(2))
            if ($null -eq $cert -or -not $cert.HasPrivateKey) {
              throw 'The .NET CertificateRequest did not produce a certificate with a private key.'
            }
            $thumb = $cert.Thumbprint
            Write-Stage ("Ephemeral code-signing certificate created: {0}" -f $thumb)

            Write-Stage 'Adding the private-key certificate to CurrentUser My.'
            $myStore = [System.Security.Cryptography.X509Certificates.X509Store]::new('My', [System.Security.Cryptography.X509Certificates.StoreLocation]::CurrentUser)
            $myStore.Open([System.Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite)
            $myStore.Add($cert)

            Write-Stage 'Adding only the public certificate to the ephemeral CurrentUser Root store.'
            $publicCert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert))
            $rootStore = [System.Security.Cryptography.X509Certificates.X509Store]::new('Root', [System.Security.Cryptography.X509Certificates.StoreLocation]::CurrentUser)
            $rootStore.Open([System.Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite)
            $rootStore.Add($publicCert)

            Write-Stage 'Creating the PowerShell UI test script.'
            $scriptPath = Join-Path $work 'MicBridgeUI.ps1'
            [IO.File]::WriteAllText($scriptPath, "Write-Output 'MicBridgeUI Authenticode test'`r`n", [Text.UTF8Encoding]::new($false))

            Write-Stage 'Signing the UI test script with SHA256.'
            $signResult = Set-AuthenticodeSignature -FilePath $scriptPath -Certificate $cert -HashAlgorithm SHA256
            Write-Stage ("Signing command returned: {0}" -f $signResult.Status)

            Write-Stage 'Verifying the Authenticode signature and signer thumbprint.'
            $verifyResult = Get-AuthenticodeSignature -FilePath $scriptPath
            if ($signResult.Status -ne [Management.Automation.SignatureStatus]::Valid -or
                $verifyResult.Status -ne [Management.Automation.SignatureStatus]::Valid -or
                $null -eq $verifyResult.SignerCertificate -or
                $verifyResult.SignerCertificate.Thumbprint -ne $thumb) {
              throw "Windows PowerShell 5.1 UI signing failed: sign=$($signResult.Status); verify=$($verifyResult.Status); message=$($verifyResult.StatusMessage)"
            }
            Write-Stage ("WINDOWS POWERSHELL 5.1 UI SIGNATURE VERIFIED: {0}" -f $thumb)

            Write-Stage 'Creating a one-byte-modified copy of the signed script.'
            $tamperedPath = Join-Path $work 'MicBridgeUI-tampered.ps1'
            $bytes = [IO.File]::ReadAllBytes($scriptPath)
            if ($bytes.Length -lt 2) { throw 'Signed UI test script is unexpectedly too short.' }
            $bytes[0] = $bytes[0] -bxor 1
            [IO.File]::WriteAllBytes($tamperedPath, $bytes)

            Write-Stage 'Verifying that Authenticode rejects the modified script.'
            $tamperedResult = Get-AuthenticodeSignature -FilePath $tamperedPath
            if ($tamperedResult.Status -ne [Management.Automation.SignatureStatus]::HashMismatch) {
              throw "Modified UI script was not rejected: status=$($tamperedResult.Status); message=$($tamperedResult.StatusMessage)"
            }
            Write-Stage 'UI AUTHENTICODE TAMPER REJECTION PASSED.'
          }
          finally {
            Write-Stage 'Cleaning up temporary certificate stores and files.'
            if ($thumb -and $null -ne $rootStore) {
              $matches = $rootStore.Certificates.Find([System.Security.Cryptography.X509Certificates.X509FindType]::FindByThumbprint, $thumb, $false)
              foreach ($item in $matches) { $rootStore.Remove($item); $item.Dispose() }
            }
            if ($thumb -and $null -ne $myStore) {
              $matches = $myStore.Certificates.Find([System.Security.Cryptography.X509Certificates.X509FindType]::FindByThumbprint, $thumb, $false)
              foreach ($item in $matches) { $myStore.Remove($item); $item.Dispose() }
            }
            if ($null -ne $rootStore) { $rootStore.Close(); $rootStore.Dispose() }
            if ($null -ne $myStore) { $myStore.Close(); $myStore.Dispose() }
            if ($null -ne $publicCert) { $publicCert.Dispose() }
            if ($null -ne $cert) { $cert.Dispose() }
            if ($null -ne $rsa) { $rsa.Dispose() }
            if (Test-Path -LiteralPath $work) { Remove-Item -LiteralPath $work -Recurse -Force -ErrorAction SilentlyContinue }
            $total.Stop()
            Write-Stage ("Test script finished cleanup. Elapsed: {0:n2}s." -f $total.Elapsed.TotalSeconds)
          }
