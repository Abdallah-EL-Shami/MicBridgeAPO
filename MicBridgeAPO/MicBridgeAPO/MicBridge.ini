; ==========================================================
;  MicBridge APO - settings
;  Installed location: C:\ProgramData\MicBridgeAPO\MicBridge.ini
;  Put comments on their own line only (no comments after a value).
;  Changes apply when the mic stream restarts (close and reopen Chrome)
;  or after restarting the Windows Audio service.
;  Day-to-day ON/OFF is done from the MicBridge window, not from here.
; ==========================================================
[Bridge]
; 1 = enabled, 0 = completely disabled (plain pass-through of the mic)
Enabled=1

; ID the APO uses to SEND the raw mic (Cantabile: ReaStream Receive with this name)
SendId=APO_MIC_RAW

; ID the APO RECEIVES the processed audio on (Cantabile: ReaStream Send with this name)
ReceiveId=APO_MIC_FX

; ReaStream default port
Port=58710

; Local broadcast address (as captured with Wireshark)
BroadcastAddress=127.255.255.255

; Listening address. 0.0.0.0 = all. Do not change unless testing.
BindAddress=0.0.0.0

; 1 = if no processed audio arrives (Cantabile closed) pass the original mic through
; 0 = output silence in that case
Fallback=1

; Anti-dropout buffer in ms (bigger = more stable but more delay)
JitterBufferMs=40
