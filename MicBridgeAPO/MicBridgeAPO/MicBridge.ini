; ==========================================================
;  MicBridge APO - ملف الإعدادات
;  مكانه بعد التثبيت: C:\ProgramData\MicBridgeAPO\MicBridge.ini
;  لا تكتب تعليقات في نهاية السطر، التعليقات على سطر مستقل فقط.
;  التعديلات تُطبَّق عند إعادة فتح مجرى المايك (أغلق Chrome ثم افتحه)
;  أو عند إعادة تشغيل خدمة Windows Audio.
; ==========================================================
[Bridge]
; 1 = مفعّل ، 0 = تمرير المايك كما هو بدون أي معالجة
Enabled=1

; المعرّف الذي يرسل به الـ APO صوت المايك الخام (في Cantabile: ReaStream Receive بهذا الاسم)
SendId=APO_MIC_RAW

; المعرّف الذي يستقبل به الـ APO الصوت المعالج (في Cantabile: ReaStream Send بهذا الاسم)
ReceiveId=APO_MIC_FX

; منفذ ReaStream الافتراضي
Port=58710

; عنوان البث (Local broadcast كما التقطناه في Wireshark)
BroadcastAddress=127.255.255.255

; عنوان الاستماع. 0.0.0.0 يعني الكل. لا تغيّره إلا للتجربة.
BindAddress=0.0.0.0

; 1 = إذا لم يصل صوت معالج (Cantabile مغلق) يمرّر المايك الأصلي كما هو
; 0 = يخرج صمتًا في هذه الحالة
Fallback=1

; حجم الحماية من التقطيع بالميلي ثانية (أكبر = أثبت لكن تأخير أكثر)
JitterBufferMs=40
